[alias]
xtask = "run --quiet --package xtask --"
# Tier 3: fmt, clippy, every test, repo-check. Exit code is the verdict.
gate = "xtask gate"
# Replay tests/scenarios/<name>.json through the frame loop offscreen (see apps/harness).
scenario = "run --quiet --package openpaint-harness -- scenario"
# Every tests/scenarios/*.json, each in a process of its own, several at once (`--jobs N`; the
# machine's threads by default): one line each in name order, the full report of each failure.
scenarios = "run --quiet --package openpaint-harness -- scenario --all"
# Structural rules the compiler cannot enforce (see xtask/src/check/rules.rs).
repo-check = "xtask check"
# The tablet APK: Rust library through cargo-ndk, then Gradle (see xtask/src/android.rs).
android-build = "xtask android-build"
# Device chores over adb (see xtask/src/device.rs): the app's library out and back in, byte
# for byte; wake, install, launch, screenshot and logcat; one injected gesture; test files away;
# a picture into the test folder for the system picker; the display's colour facts, read-only;
# the installed build walked through its main features on a test artwork (about 20 s); the
# app's data cleared, only after a backup written the same day; the tablet's newest screenshots
# copied here, nothing on it changed; whether the tablet is free (screen off or untouched for 10
# minutes: exit 0), read-only; the app's own last log lines, read-only; the debug build's frames
# in real use, a line a stretch of motion, summed up (read-only; `--clear` empties them).
device-backup = "xtask device-backup"
device-restore = "xtask device-restore"
device-check = "xtask device-check"
device-input = "xtask device-input"
device-clean = "xtask device-clean"
device-push = "xtask device-push"
device-info = "xtask device-info"
device-smoke = "xtask device-smoke"
device-screens = "xtask device-screens"
device-reset = "xtask device-reset"
device-idle = "xtask device-idle"
device-log = "xtask device-log"
device-frames = "xtask device-frames"
# Test artworks as OpenPaint files, deterministic (apps/harness/src/test_art/):
# `cargo test-art pile|a4|a4-plain|kinds|session [n] [out]` -> artifacts/test-art/<kind>-<n>.openpaint.
test-art = "run --quiet --package openpaint-harness -- test-art"
# Practice packs from the curated source lists in tools/packs/lists/ (see tools/packs/src/; a
# workspace of its own outside the gate, built in tools/packs/target/):
# `cargo practice-pack build <list> [out] [--sheet]` -> artifacts/packs/<pack id>.pack, the same
# bytes from the same list and download cache; `cargo practice-pack search <source> <query>`.
practice-pack = "run --quiet --manifest-path tools/packs/Cargo.toml --"
# The brush shape textures (crates/render/assets/shape-*.bin) from seeded noise (see
# xtask/src/shapes.rs); deterministic, committed, their hashes in DECISIONS.
shape-assets = "xtask shape-assets"
