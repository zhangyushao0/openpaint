[alias]
xtask = "run --quiet --package xtask --"
# Tier 3: fmt, clippy, every test, repo-check. Exit code is the verdict.
gate = "xtask gate"
# Replay tests/scenarios/<name>.json through the frame loop offscreen (see apps/harness).
scenario = "run --quiet --package openpaint-harness -- scenario"
# Every tests/scenarios/*.json in one process: one line each, the full report of each failure.
scenarios = "run --quiet --package openpaint-harness -- scenario --all"
# Structural rules the compiler cannot enforce (see xtask/src/check/rules.rs).
repo-check = "xtask check"
# The tablet APK: Rust library through cargo-ndk, then Gradle (see xtask/src/android.rs).
android-build = "xtask android-build"
# Build, install over adb and launch on the connected device.
android-install = "xtask android-install"
# Device chores over adb (see xtask/src/device.rs): the app's library out and back in, byte
# for byte; wake, install, launch, screenshot and logcat; one injected gesture; test files away;
# a picture into the test folder for the system picker; the display's colour facts, read-only;
# the installed build walked through its main features on a test artwork (about 20 s).
device-backup = "xtask device-backup"
device-restore = "xtask device-restore"
device-check = "xtask device-check"
device-input = "xtask device-input"
device-clean = "xtask device-clean"
device-push = "xtask device-push"
device-info = "xtask device-info"
device-smoke = "xtask device-smoke"
# The brush shape textures (crates/render/assets/shape-*.bin) from seeded noise (see
# xtask/src/shapes.rs); deterministic, committed, their hashes in DECISIONS.
shape-assets = "xtask shape-assets"
