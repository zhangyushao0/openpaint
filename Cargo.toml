[workspace]
members = [
    "apps/android",
    "apps/harness",
    "crates/app",
    "crates/core",
    "crates/devtools",
    "crates/practice",
    "crates/practice-store",
    "crates/raster",
    "crates/render",
    "crates/runtime",
    "crates/sheet",
    "crates/store",
    "crates/ui",
    "xtask",
]
resolver = "3"

[workspace.package]
# The app's version (DECISIONS D79): xtask hands it to Gradle with the store's format as build
# metadata (xtask/src/version.rs).
version = "1.21.4"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
openpaint-app = { path = "crates/app" }
openpaint-core = { path = "crates/core" }
openpaint-devtools = { path = "crates/devtools" }
openpaint-practice = { path = "crates/practice" }
openpaint-practice-store = { path = "crates/practice-store" }
openpaint-raster = { path = "crates/raster" }
openpaint-render = { path = "crates/render" }
openpaint-runtime = { path = "crates/runtime" }
openpaint-sheet = { path = "crates/sheet" }
openpaint-store = { path = "crates/store" }
openpaint-ui = { path = "crates/ui" }

# External crates are pinned exactly; upgrades are reviewed changes (DECISIONS D14).
# egui-wgpu 0.36.2 requires wgpu 30.0; the three move together.
android_logger = "=0.15.1"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
# The OpenPaint file's and a practice pack's check sums (DECISIONS D62, D101); store and
# practice-store only. Already in the tree through png.
crc32fast = "=1.5.2"
# The artwork library's key-value store (DECISIONS D09); store only.
fjall = "=3.1.11"
# PNG and JPEG files for export, reference images and practice packs (DECISIONS D14); store and
# practice-store only.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
jni = "=0.22.4"
log = "=0.4.34"
# The display cache's compression (DECISIONS D81); store only. Already in the tree through fjall,
# with the features fjall builds it with.
lz4_flex = "=0.13.1"
# ICC colour management of picture files (DECISIONS D53); store only. Already in the tree
# through image, whose CICP conversions use it.
moxcms = "=0.8.1"
png = "=0.18.1"
pollster = "=1.0.1"
raw-window-handle = "=0.6.2"
# Scenario files only (devtools); never in a product crate.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Brush recipe files (app only): read as a table, no serde derive in product code.
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }
wgpu = "=30.0.1"

# Debug builds for agents and tests carry no debug info (S106c): a panic still names its file and
# line (the panic's location is compiled in), a backtrace its functions (the .pdb keeps symbols),
# and a test binary's .pdb is a third of its size with line tables (the runtime tests' 62 to 23
# MB). Dependencies are optimised, so GPU tests, egui and PNG writing in scenarios run near
# release speed. Neither changes a result: no fast-math, debug assertions and overflow checks
# stay on.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 2

# Practice's geometry casts some millions of rays a test (S94: objects' exact edges and pictures,
# 300 of each); unoptimised, its tests took two minutes of the gate. Line tables kept, results
# unchanged (no fast-math).
[profile.dev.package.openpaint-practice]
opt-level = 2

# Lints apply to every crate through `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Threshold lives in clippy.toml (60 lines of code per function).
too_many_lines = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
