[workspace]
members = [
    "apps/android",
    "apps/harness",
    "crates/app",
    "crates/core",
    "crates/devtools",
    "crates/render",
    "crates/runtime",
    "crates/store",
    "crates/ui",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
openpaint-app = { path = "crates/app" }
openpaint-core = { path = "crates/core" }
openpaint-devtools = { path = "crates/devtools" }
openpaint-render = { path = "crates/render" }
openpaint-runtime = { path = "crates/runtime" }
openpaint-store = { path = "crates/store" }
openpaint-ui = { path = "crates/ui" }

# External crates are pinned exactly; upgrades are reviewed changes (DECISIONS D14).
# egui-wgpu 0.36.2 requires wgpu 30.0; the three move together.
android_logger = "=0.15.1"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
jni = "=0.22.4"
log = "=0.4.34"
png = "=0.18.1"
pollster = "=1.0.1"
raw-window-handle = "=0.6.2"
# Scenario files only (devtools); never in a product crate.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wgpu = "=30.0.1"

# Lints apply to every crate through `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Threshold lives in clippy.toml (60 lines of code per function).
too_many_lines = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
