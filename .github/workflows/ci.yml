# OpenPaint's CI (S162). Every push to main and every pull request: the gate on GitHub's Linux
# runner (no GPU: the GPU tests run on Mesa's software Vulkan, lavapipe), and the tablet's APK
# built and kept as the run's artifact. A version tag (`v1.34.0`, the workspace's version) also
# publishes that APK as a GitHub Release.
#
# The APK is signed with the debug key in the secret ANDROID_DEBUG_KEYSTORE (the base64 of the
# key the author's own builds use), so it installs over the app on their tablet; without the
# secret a fresh key signs it, and it installs only where no OpenPaint is.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The toolchain pinned in rust-toolchain.toml, with clippy, rustfmt and the Android target.
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # What holds only on a hardware GPU is left out and named (xtask/src/test_run/software.rs).
      - run: cargo gate
        env:
          OPENPAINT_SOFTWARE_GPU: lavapipe

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
      - run: cargo install cargo-ndk --locked
      - name: Debug key
        if: env.KEYSTORE != ''
        run: mkdir -p ~/.android && printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      # The runner's Android SDK (ANDROID_HOME) and NDK (ANDROID_NDK_HOME).
      - run: cargo android-build
      - uses: actions/upload-artifact@v4
        with:
          name: openpaint-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The tag names the workspace's version, or nothing is published.
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, workspace $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: openpaint-apk
      - run: mv app-debug.apk "openpaint-$GITHUB_REF_NAME.apk"
      - run: >
          gh release create "$GITHUB_REF_NAME" "openpaint-$GITHUB_REF_NAME.apk"
          --title "OpenPaint ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
