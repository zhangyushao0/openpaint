# The second official practice pack: compositions in three tiers (ROADMAP S85), the pictures
# week 3 of V大's course on needs: picture division (画面分割: about five long main dividing
# lines, then the secondary and tertiary ones), Notan in two or three values, whole-picture
# copies in line or colour blocks, colour copies and abstract analysis (the focal point, the
# contrasts and how they are spread). Built by
# `cargo practice-pack build apps/harness/packs/compositions.toml --sheet`; the format is in
# apps/harness/src/pack/list.rs. No picture is kept here: each item names its object at its
# source, the licence the source must state, and why it is in its tier.
#
# Value masses (S96): each picture's three-value answer is made as the pack is built and drawn
# beside it on its tier's sheet; `no_masses` says why an item's answer does not read as a
# squinting eye sees the picture (judged on the sheets, 2026-10-30), and it never comes up in
# value masses.
#
# Sources: public-domain paintings of the Met (`isPublicDomain`), the Art Institute of Chicago
# (`is_public_domain`) and the National Gallery of Art (`openaccess` in its open data), all three
# CC0, and of the Rijksmuseum (its picture's own rights statement, the Public Domain Mark, kept as
# PD-old); stills of Blender's open films (`at`, the second) from their official releases on
# Wikimedia Commons, under the film file's CC BY with its attribution.
#
# The tiers (`PictureKind::tiers`; no entry tier: even the simplest composition is a few masses):
# - simple: two or three big masses and one focal point; a Notan in two values reads at a glance;
# - medium: four to six masses in three values, secondary dividing lines, a figure or two;
# - hard: many masses, figures in space, close values or a crowd held together by its light.
#
# Chosen on the contact sheets for a readable large structure, a clear focal point, strong and
# weak contrasts, quiet low-saturation colour as well as bright; landscapes, interiors, figures in
# space, still lifes and city views. Left out: nudes, violence, devotional pictures, portraits
# without space, pictures dominated by text, small or damaged scans, scans showing the frame,
# film frames showing actors' faces, and any licence the API does not state as the list's.
# Looked at and left out (S85): a Monet stack in summer, Cézanne's Gulf of Marseille and Mont
# Sainte-Victoire (the bay and the bands kept once), Turner's Whalers and Valley of Aosta (no
# readable focal point), Twachtman's Winter Harmony (no structure), Madame X and Van Gogh's
# Wheat Field with Cypresses (the Met's scans show the frame), van de Cappelle's Calm (only 843
# pixels), Cassatt's Child's Bath (a bare child), a fourth and fifth Vermeer, Homer's Breezing
# Up, Chardin's Attentive Nurse, Bellows' Lone Tenement, Pissarro's Louvre in rain, Breitner's
# Kimono, Cuyp's riders, Constable's Salisbury, Boudin's Beach; Cosmos Laundromat (CC BY-SA on
# Commons), Tears of Steel (actors), Glass Half (picture frames), Singularity (no ground).
# No outline: a composition is compared by its picture in place.
#
# Crops (S101): each painting's best corner holding a colour combination is cut as a crop
# (`openpaint_practice::crop`) and judged on `openpaint-compositions-crops-<n>.png`; a corner
# showing a recognisable object, a figure or the scan's edge is listed out with why
# (`no_crop.1`, 2026-11-05), the composition itself unchanged.

id = "openpaint-compositions"
title = "Compositions"
