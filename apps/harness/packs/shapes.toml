# The first official practice pack: single shapes in four tiers (ROADMAP S78), for V大's
# 复制单体图形, copying one object by its outline: clean things with clear outlines, no trees or
# water, the subjects varied. Built by `cargo practice-pack build apps/harness/packs/shapes.toml`;
# the format is in apps/harness/src/pack/list.rs. No picture is kept here: each item names its
# object at its source, the licence the source's API must state, and why it is in its tier.
#
# The tiers:
# - entry: cartoon creatures and characters, flat or simply shaded, one closed outline each
#   (Twemoji, Pepper&Carrot, Blender's Big Buck Bunny, OpenGameArt), CC BY with their
#   attribution;
# - simple: vessels, furniture, lamps and tools on plain studio grounds, symmetric or nearly,
#   few parts (Cleveland Museum of Art and the Met, CC0);
# - medium: animals, standing figures and everyday things whose outlines are longer and softer
#   (museum CC0; US Fish and Wildlife Service fish illustrations, US federal public domain);
# - hard: heads, armour, clocks, instruments and machines: many parts, overlaps, perspective
#   (museum CC0; NASA photographs, US federal public domain).
#
# Looked at on contact sheets (`--sheet`) before going in; left out: busy or textured grounds,
# watermarks or labels, pairs and groups, cropped figures, nudity, living people's faces, any
# licence the API does not state as one of the pack's.

id = "openpaint-shapes"
title = "Single shapes"
kind = "shape"

