# The textures pack (S101): photographs of rust, peeling paint, weathered walls and torn posters,
# only ever cropped. V大's 色彩组合 copies a corner of an abstract oil painting or of a rusted old
# thing, never a concrete object: each photograph gives its best two crops of three to seven areas
# of distinct colour, some low in saturation, at least one weak contrast between neighbours
# (`openpaint_practice::crop`), each crop an item of the pack with its areas. Built by
# `cargo practice-pack build apps/harness/packs/textures.toml --sheet`; the crops are judged on the
# crops' sheets (`openpaint-textures-crops-<n>.png`, each beside its areas, its weak contrasts
# red), and one that shows a recognisable object or whose areas do not read is listed out on its
# photograph's item with why: `no_crop.2 = "a bolt's head"`. The format is in
# apps/harness/src/pack/list.rs. No picture is kept here: each item names its file on Wikimedia
# Commons, whose own licence field (`License`, `LicenseShortName`) must state CC0.
#
# Chosen from Commons' CC0 texture series and searches (rust, peeling paint, weathered paint) for
# large patches of a few colours: of 87 photographs tried, these give crops. Left out: material
# maps made for 3D; objects (rivets, bolts, gears, ropes, house fronts and eaves, numbers and
# signs); one flat colour or an even pattern over the whole photograph (concrete, carpet, grass,
# tiles, shingles, wood grain); photographs whose every crop breaks a rule: lichen and rock read as
# specks (more texture than areas), vivid paint without a grey, and most rust and peeling paint,
# whose crops hold one colour shading into another (fewer than three areas); and any file whose
# licence the API does not state as CC0.

id = "openpaint-textures"
title = "Textures"
kind = "crop"

