# The colour combinations pack (S101, named so in S101c): pictures only ever cropped, every crop
# of colour combinations but the composition pack's corners. V大's 色彩组合 copies a corner of an
# abstract oil painting or of a rusted old thing, never a concrete object: each picture gives its
# best two crops of three to seven areas of distinct colour, some low in saturation, at least one
# weak contrast between neighbours (`openpaint_practice::crop`), each crop an item of the pack
# with its areas, cut from the picture's full pixels (at most 4,096) and 768 to 1,024 pixels long.
# Built by `cargo practice-pack build apps/harness/packs/combinations.toml --sheet`; the crops are
# judged on the crops' sheets (`openpaint-combinations-crops-<n>.png`, each beside its areas, its
# weak contrasts red), and one that shows a recognisable object or whose areas do not read is
# listed out on its picture's item with why: `no_crop.2 = "a bolt's head"`. The format is in
# apps/harness/src/pack/list.rs. No picture is kept here: each item names its object at its
# source, which states its licence (Commons' `License`, the museums' public-domain fields), or
# dedicates every asset to CC0 (the texture libraries, `libraries.rs`).
#
# Four sources:
# - CC0 photographs on Commons (S101): rust, peeling paint and torn posters, from Commons' CC0
#   texture series; of 87 tried, these give crops. A photograph under about 1,400 pixels on its
#   shorter side gives none (S101b). Left out: objects (rivets, bolts, gears, ropes, house fronts
#   and eaves, numbers and signs); one flat colour or an even pattern over the whole photograph;
#   photographs whose every crop breaks a rule (lichen and rock read as specks, vivid paint without
#   a grey, rust shading from one colour into another).
# - Colour maps of CC0 texture libraries at 4K (S101c): ambientCG's and Poly Haven's rusted and
#   painted metal, peeling paint, plaster and painted wood, never their normal, roughness or height
#   maps; materials of one flat colour or a printed sign left out. Of 43 maps, 11 give a crop that
#   keeps the rules: a colour map is even, most crops of it one or two areas.
# - Public-domain paintings whose corners read abstract (S101c), from open-access collections at
#   their full size (the Art Institute's at 3,000 pixels): late Turner, Monet's water lilies and
#   London, Whistler's nocturnes, Kandinsky, Klee, Marc, Delaunay. Cropped like the photographs,
#   never compositions; a crop showing a figure, a boat, a building, a signature or the canvas's or
#   frame's edge is listed out. Left out: a Whistler etching on Commons (a print, its plate's edge).

