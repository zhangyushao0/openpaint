# The colour combinations pack (S101, named so in S101c): pictures only ever cropped, every crop
# of colour combinations but the composition pack's corners. V大's 色彩组合 copies a corner of an
# abstract oil painting or of a rusted old thing, never a concrete object: each picture gives
# every crop that keeps the rules, six at most (S159), of three to seven areas of distinct colour,
# some low in saturation, at least one weak contrast between neighbours
# (`openpaint_practice::crop`): three sizes and three shapes tried at five places by five, best
# first, none overlapping a better one by more than a quarter, and a crop whose answer breaks a
# rule once packed makes way for the next best. Each crop is an item of the pack with its areas,
# cut from the picture's full pixels (at most 4,096) and 768 to 1,024 pixels long.
#
# Built by `cargo practice-pack build tools/packs/lists/combinations.toml --sheet`; `--from <item
# id>` builds that item and those after it into artifacts/packs/curate/, for judging a new batch.
# The crops are judged on the crops' sheets (`openpaint-combinations-crops-<n>.png`, each beside
# its areas, its weak contrasts red); one that shows a recognisable object, a figure, a signature
# or script, the canvas's, frame's or scan's edge, or whose areas do not read is listed out on its
# picture's item with why: `no_crop.2 = "a bolt's head"`; a picture none of whose crops is kept is
# left out of the list. The format is in tools/packs/src/list.rs. No picture is kept here: each
# item names its object at its source, which states its licence (Commons' `License`, the museums'
# public-domain fields, Openverse's `license` and `license_version`), or dedicates every asset to
# CC0 (the texture libraries, `libraries.rs`).
#
# 194 pictures give 454 crops: 255 simple, 118 medium, 81 hard (S159, 2026-11-16; 62 crops, 13 of
# them hard, before). By source, the pictures listed before S159 or tried in it, those kept, and
# their crops:
# - Commons, 106 / 77 / 202: CC0 photographs of rust, peeling paint and torn posters (S101; a
#   photograph under about 1,400 pixels on its shorter side gives none), peeling paint 3,500
#   pixels wide or more (S159), and public-domain paintings whose corners read abstract (S101c,
#   S158p) or of many flat areas (S159: Kandinsky, Delaunay, Klee, Kliun, Popova, Macke, Exter).
#   Left out: scans too large to decode or not served (Jawlensky, af Klint, Malevich, three
#   Kandinskys); busy abstracts whose colours are all saturated (no weak contrast) or whose best
#   crop is past seven areas; paintings whose every crop shows a signature, script, a vase or a
#   jug, or the canvas's edge.
# - The Art Institute of Chicago, 61 / 36 / 70, and the National Gallery of Art, 49 / 29 / 70 (both
#   CC0; S101c, S159): Monet's water lilies, London and haystacks, Turner, Kandinsky, Twachtman,
#   Hassam, Sisley, Renoir, Pissarro, Courbet, Moran, Daubigny, Gauguin, Jawlensky. Left out:
#   pictures whose every crop shows a haystack, a house, a bridge, a boat, trees against the sky
#   or a figure, or gives fewer than three areas (most of the Inness and Sisley tried).
# - Texture Ninja, 74 / 37 / 74 (CC0, S159): rusted and flaking paint and damaged plaster. Left
#   out: one or two areas, speckle, or every crop showing a bolt, a bracket, a pipe, a panel's
#   edge or a sprayed scrawl.
# - Openverse, 10 / 6 / 16 (S159): CC0 photographs of the WordPress Photo Directory at their full
#   size; Flickr's through Openverse are at most 1,024 pixels and give none.
# - ambientCG, 27 / 8 / 19, and Poly Haven, 16 / 1 / 3 (CC0 colour maps at 4K, S101c): rusted and
#   painted metal, plaster and wood, never their normal, roughness or height maps; a colour map is
#   even, most crops of it one or two areas.

