# Sketch (S76, S100): graphite on the paper's tooth for marks and construction lines, the Pencil as
# 1.17.0 shipped it (D38), kept here so a retuned built-in never reaches it. Pressure widens the
# line, presses the tip into more of the paper and lays more graphite; where the stroke crosses
# itself it darkens. Laid on its side it draws wider and lighter, as a pencil lead does.
name = "Sketch"

[size]
default = 5
min = 1
max = 40
pressure = [[0.0, 0.3], [1.0, 1.0]]
tilt = [[0.0, 1.0], [60.0, 1.0], [75.0, 3.0]]

[opacity]
default = 1.0
pressure = [[0.0, 0.29032258], [1.0, 1.0]]
tilt = [[0.0, 1.0], [60.0, 1.0], [75.0, 0.25]]

[accumulate]
tip = "flat"
flow = 3.1
max_density = 1.0

[paper]
texture = "sketch"
contact = [[0.0, 0.4], [1.0, 0.95]]
scale = 4.5
depth = 0.3
dust = 0.3
